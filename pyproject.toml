[project]
name = "spotify-mcp"
version = "0.1.0"
description = "Spotify MCP server with PKCE auth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/spotify_mcp", "README.md", "pyproject.toml"]
